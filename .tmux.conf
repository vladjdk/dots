# Remap prefix to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Intuitive splits (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Switch panes with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Mouse support
set -g mouse on

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Faster escape (useful for vim)
set -sg escape-time 0

# Forward focus events to applications (needed for vim autoread)
set -g focus-events on

# Reload config with prefix+r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Vi-mode for copy mode
setw -g mode-keys vi

# Window 2: nvim with two terminal panes at bottom (20% height, split in middle)
bind E new-window -n editor -c "#{pane_current_path}" \; \
  send-keys 'nvim' Enter \; \
  split-window -v -p 20 -c "#{pane_current_path}" \; \
  split-window -h -c "#{pane_current_path}" \; \
  select-pane -t 1
